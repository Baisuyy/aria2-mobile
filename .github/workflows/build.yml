name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要把 APK 作为 Release 资产上传
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # ubuntu-latest 已预装完整 Android SDK；此处仅写入 sdk.dir 供 AGP 定位。
      - name: Point Gradle at preinstalled Android SDK
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      # 仅当配置了签名 Secrets 时写入正式签名；否则 release 构建自动回退 debug 签名，
      # 保证 CI 始终能产出可安装的 APK。
      - name: Restore release signing key
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
            printf 'storeFile=./keystore/release.jks\n' > keystore.properties
            printf 'storePassword=%s\n' "${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            printf 'keyAlias=%s\n' "${{ secrets.KEY_ALIAS }}" >> keystore.properties
            printf 'keyPassword=%s\n' "${{ secrets.KEY_PASSWORD }}" >> keystore.properties
            echo "restored release keystore"
          else
            echo "no keystore secrets - using debug-signing fallback"
          fi

      - name: Build release APK (per-ABI split + universal)
        run: gradle :app:assembleRelease --no-daemon --console=plain

      # 把拆分产物改名为人可读的文件名，并按 ABI 分发。
      - name: Rename split APKs
        shell: bash
        run: |
          set -e
          V=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' app/build.gradle.kts | head -n1)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          cd app/build/outputs/apk/release
          ls -1 *.apk
          for f in app-*.apk; do
            case "$f" in
              *universal*)    n="aria2-mobile-universal-${V}.apk" ;;
              *arm64-v8a*)    n="aria2-mobile-arm64-v8a-64bit-${V}.apk" ;;
              *armeabi-v7a*)  n="aria2-mobile-armeabi-v7a-32bit-${V}.apk" ;;
              *)              n="aria2-mobile-${V}.apk" ;;
            esac
            mv "$f" "$n"
            echo "  -> $n"
          done

      # 每个 APK 单独一个 artifact（Actions 页面仍会打包，但按架构区分，便于定位）。
      - name: Upload APKs (separate per ABI)
        uses: actions/upload-artifact@v4
        with:
          name: aria2-mobile-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 直接发布到 Release（Assets 是裸 .apk，可一键安装，不再嵌在 zip 里）。
      - name: Publish APKs to Release (direct .apk)
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build
          name: 最新构建 aria2-mobile ${{ env.VERSION }}
          body: |
            按 ABI 拆分为以下 APK（选择与你设备匹配的一个安装）：
            - `aria2-mobile-arm64-v8a-64bit-${{ env.VERSION }}.apk`：64 位设备（绝大多数现代手机）优先安装这个
            - `aria2-mobile-armeabi-v7a-32bit-${{ env.VERSION }}.apk`：仅支持 32 位的老设备
            - `aria2-mobile-universal-${{ env.VERSION }}.apk`：通用包，同时含两种架构，体积约 2 倍，装机兼容性最好
            `${{ github.sha }}` · `${{ github.run_number }}`
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}