name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (command line tools)
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 仅当配置了签名 Secrets 时写入正式签名；否则 release 构建自动回退 debug 签名，
      # 保证 CI 始终能产出可安装的 APK。
      - name: Restore release signing key
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            mkdir -p keystore
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/release.jks
            cat > keystore.properties <<'EOF'
storeFile=./keystore/release.jks
storePassword=${{ secrets.KEYSTORE_PASSWORD }}
keyAlias=${{ secrets.KEY_ALIAS }}
keyPassword=${{ secrets.KEY_PASSWORD }}
EOF
            echo "restored release keystore"
          else
            echo "no keystore secrets — using debug-signing fallback"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --console=plain

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error